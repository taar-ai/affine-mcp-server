# Apply only after parent review and cluster deployment authorization.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: affine-mcp
  namespace: taar-int-affine
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-mcp
  namespace: taar-int-affine
data:
  MCP_TRANSPORT: http
  AFFINE_MCP_HTTP_HOST: 127.0.0.1
  PORT: "3000"
  AFFINE_MCP_AUTH_MODE: oauth
  AFFINE_BACKEND_AUTH_MODE: oauth_token_exchange
  AFFINE_BASE_URL: "http://affine-api:3010"
  AFFINE_ALLOW_INSECURE_HTTP: "true"
  AFFINE_TOKEN_EXCHANGE_URL: http://affine-api:3010/api/auth/taar/mcp/token
  AFFINE_MCP_PUBLIC_BASE_URL: https://affine-mcp.internal.taar.ltd
  AFFINE_OAUTH_ISSUER_URL: https://int30.taar.ltd
  AFFINE_OAUTH_SCOPES: openid email profile
  AFFINE_OAUTH_METADATA_RELAY_BASE_URL: http://affine-taar-jwks:8080
  AFFINE_TOOL_PROFILE: authoring
  AFFINE_CANVAS_RENDER_ENABLED: "false"
  XDG_CONFIG_HOME: /tmp/affine-mcp
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: affine-mcp-internal
  namespace: taar-int-affine
spec:
  secretName: affine-mcp-internal-tls
  dnsNames:
    - affine-mcp.internal.taar.ltd
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-mcp-tls
  namespace: taar-int-affine
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log off;
      server_tokens off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8443 ssl;
        server_name affine-mcp.internal.taar.ltd;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 4m;
        if ($host != affine-mcp.internal.taar.ltd) { return 421; }
        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Host affine-mcp.internal.taar.ltd;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-mcp
  namespace: taar-int-affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: affine-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine-mcp
    spec:
      serviceAccountName: affine-mcp
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: taaracr0-secret
      nodeSelector:
        location: ahd
        workload: gp
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: taaracr0.azurecr.io/taar-affine-mcp@sha256:73621ace4ad927e8f48c9bdba6df48bdc6bd50e21db81abe38dd9f26f3b3b7dc
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: affine-mcp
          # Parent supplies the exact EXISTING TaarInternal tunnel resource.
          # A missing ConfigMap/key prevents startup; no internal-audience fallback.
          env:
            - name: AFFINE_OAUTH_RESOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: affine-mcp-resource
                  key: OAUTH_RESOURCE
                  optional: false
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            exec:
              command: [wget, -q, -T, "1", -O, /dev/null, "http://127.0.0.1:3000/healthz"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [wget, -q, -T, "1", -O, /dev/null, "http://127.0.0.1:3000/healthz"]
            periodSeconds: 20
          readinessProbe:
            exec:
              command: [wget, -q, -T, "11", -O, /dev/null, "http://127.0.0.1:3000/readyz"]
            timeoutSeconds: 12
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: canvas-renderer
          image: taaracr0.azurecr.io/taar-affine-mcp@sha256:df959bb64178b70012d44dc42bee1e143a29c04343af4d5aa7dd1feb1fe6adb0
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args: ["ulimit -c 0; exec node dist/canvasRenderServer.js"]
          env:
            - name: AFFINE_RENDER_BACKEND_ORIGIN
              value: http://affine-api:3010
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/wiki-renderer-v2.json
            appArmorProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            timeoutSeconds: 3
            periodSeconds: 15
          livenessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            timeoutSeconds: 3
            periodSeconds: 20
          volumeMounts:
            - name: renderer-tmp
              mountPath: /tmp
            - name: renderer-shm
              mountPath: /dev/shm
        - name: tls
          image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          command: [/bin/sh, -ec]
          args:
            - |
              while sleep 3600; do nginx -t -q && nginx -s reload; done &
              exec nginx -g 'daemon off;'
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: renderer-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: renderer-shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: nginx-config
          configMap:
            name: affine-mcp-tls
        - name: tls
          secret:
            secretName: affine-mcp-internal-tls
            defaultMode: 0440
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: affine-mcp
  namespace: taar-int-affine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: affine-mcp
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: affine-mcp
  namespace: taar-int-affine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: affine-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: taar-internal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openai-mcp-gateway
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: affine
      ports:
        - protocol: TCP
          port: 3010
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: affine-taar-jwks
      ports:
        - protocol: TCP
          port: 8080
