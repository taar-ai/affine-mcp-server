name: Taar Internal Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'taar-ai/affine-mcp-server'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build local smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: taar-affine-mcp:internal-smoke
          cache-from: type=gha
      - name: Verify delegated image runtime
        run: bash scripts/smoke-internal-image.sh taar-affine-mcp:internal-smoke
      - name: Verify private TLS frontend
        run: bash scripts/smoke-internal-tls.sh taar-affine-mcp:internal-smoke
      - name: Log in with repository-scoped ACR token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: taaracr0.azurecr.io
          username: ${{ secrets.TAAR_AFFINE_MCP_ACR_USERNAME }}
          password: ${{ secrets.TAAR_AFFINE_MCP_ACR_PASSWORD }}
      - name: Build Taar source image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: taaracr0.azurecr.io/taar-affine-mcp:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/taar-ai/affine-mcp-server
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Taar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "taaracr0.azurecr.io/taar-affine-mcp@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
